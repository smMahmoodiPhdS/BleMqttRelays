; PlatformIO Project Configuration File
; https://docs.platformio.org/page/projectconf.html
;
; Two board variants share this firmware:
;
;   esp32dev      (default) HW_4_6 protoboard / 4-slider relay test rig
;                 relays 15/2/4/16, no coil feedback wired, OTA hw ver 1-0
;   actuator-ble  actuator-node-Ble PCB
;                 relays 13/14/25/26, feedback 34/35/36/39, OTA hw ver 2-0
;
;   pio run                      -> bench rig
;   pio run -e actuator-ble -t upload
;
; The two pin maps overlap destructively: on the PCB, GPIO15 and GPIO4 are DIP
; inputs with 10k pull-ups and GPIO2 drives the status LED, so a protoboard
; binary would drive outputs straight into them. The OTA hardware version
; differs between variants precisely so that cannot happen over the air.

[platformio]
default_envs = esp32dev

[env]
platform = espressif32@5.4.0
board = esp32dev
framework = arduino
monitor_speed = 115200
; WiFi + BLE + IotWebConf + HTTPUpdate + Preferences together don't fit the
; default 1.25MB OTA app slot; min_spiffs.csv gives ~1.9MB per OTA slot
; (still on a 4MB flash board) while keeping the dual-OTA-partition layout.
board_build.partitions = min_spiffs.csv
lib_deps =
	prampec/IotWebConf@^3.2.1
	knolleary/PubSubClient@^2.8

[env:esp32dev]
build_flags = -D BOARD_PROTO_4_6

[env:actuator-ble]
build_flags = -D BOARD_ACTUATOR_BLE
